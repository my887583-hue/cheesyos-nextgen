name: CheesyOS NextGen POS — Windows 11 Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pos-v3-online-first
      - main
    paths:
      - 'nextgen/windows-pos/**'
      - 'nextgen/packages/**'
      - '.github/workflows/windows-test-build.yml'

jobs:
  build-windows:
    name: Build Native Windows x64 Executable & Installer
    runs-on: windows-latest
    env:
      VITE_NEXTGEN_SUPABASE_URL: ${{ secrets.VITE_NEXTGEN_SUPABASE_URL }}
      VITE_NEXTGEN_SUPABASE_ANON_KEY: ${{ secrets.VITE_NEXTGEN_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nextgen/windows-pos/src-tauri

      - name: Install Frontend Dependencies
        working-directory: nextgen
        run: npm install --include=optional

      - name: Verify Windows Native Binding
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "nextgen" -Filter "*rolldown-binding.win32-x64-msvc.node*" -Recurse -ErrorAction SilentlyContinue
          if ($found) {
            Write-Host "WINDOWS_ROLLDOWN_BINDING_PRESENT=YES"
          } else {
            Write-Host "WINDOWS_ROLLDOWN_BINDING_PRESENT=NO"
          }

      - name: Verify NextGen Supabase Config Presence
        shell: pwsh
        env:
          VITE_NEXTGEN_SUPABASE_URL: ${{ secrets.VITE_NEXTGEN_SUPABASE_URL }}
          VITE_NEXTGEN_SUPABASE_ANON_KEY: ${{ secrets.VITE_NEXTGEN_SUPABASE_ANON_KEY }}
        run: |
          if ($env:VITE_NEXTGEN_SUPABASE_URL) {
            Write-Host "NEXTGEN_SUPABASE_URL_PRESENT=YES"
          } else {
            Write-Host "NEXTGEN_SUPABASE_URL_PRESENT=NO"
          }
          if ($env:VITE_NEXTGEN_SUPABASE_ANON_KEY) {
            Write-Host "NEXTGEN_SUPABASE_ANON_KEY_PRESENT=YES"
          } else {
            Write-Host "NEXTGEN_SUPABASE_ANON_KEY_PRESENT=NO"
          }

      - name: Build Frontend Application
        working-directory: nextgen/windows-pos
        env:
          VITE_NEXTGEN_SUPABASE_URL: ${{ secrets.VITE_NEXTGEN_SUPABASE_URL }}
          VITE_NEXTGEN_SUPABASE_ANON_KEY: ${{ secrets.VITE_NEXTGEN_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Run Windows Native Rust Unit Tests
        run: cargo test --manifest-path nextgen/windows-pos/src-tauri/Cargo.toml

      - name: Build Release Binary (x64)
        run: cargo build --release --manifest-path nextgen/windows-pos/src-tauri/Cargo.toml

      - name: Build Tauri Package (Unsigned Internal Test Build)
        working-directory: nextgen/windows-pos
        env:
          VITE_NEXTGEN_SUPABASE_URL: ${{ secrets.VITE_NEXTGEN_SUPABASE_URL }}
          VITE_NEXTGEN_SUPABASE_ANON_KEY: ${{ secrets.VITE_NEXTGEN_SUPABASE_ANON_KEY }}
        run: npx --yes @tauri-apps/cli build --no-sign

      - name: Upload Windows 11 Test Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheesyos-windows-pos-x64-test-build
          path: |
            nextgen/windows-pos/src-tauri/target/release/cheesyos-windows-pos.exe
            nextgen/windows-pos/src-tauri/target/release/bundle/msi/*.msi
            nextgen/windows-pos/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
